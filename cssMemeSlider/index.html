<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital@1&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./style.css">
	<link rel="shortcut icon" href="./assets/favicon/Mem.ico" type="image/x-icon">
	<title>cssMemeSlider</title>
</head>
<body>
	<!-- <header class="header">
		<h1 class="head">
			CSS MEME SLIDER
		</h1>
	</header> -->
	<div class="container">
		<div class="slider__wrapper">
			<input type="radio" name="slide" id="one" checked>
			<input type="radio" name="slide" id="two">
			<input type="radio" name="slide" id="three">
			<input type="radio" name="slide" id="four">
			<input type="radio" name="slide" id="five">

			<div class="slider__container">
				<div class="slide slide1 started">
					<img src="./assets/images/Mem1.jpg" alt="mem" class="mem1">
				</div>
				<div class="slide">
					<img src="./assets/images/Mem2.jpg" alt="mem" class="mem2">
				</div>
				<div class="slide">
					<img src="./assets/images/Mem3.png" alt="mem" class="mem3">
				</div>
				<div class="slide">
					<img src="./assets/images/Mem4.png" alt="mem" class="mem4">
				</div>
				<div class="slide">
					<img src="./assets/images/Mem5.jpg" alt="mem" class="mem5">
				</div>
			</div>
			<div class="text__wrapper">
				<div class="text__container">
					<div class="text__slider">
						<div class="text text1 started">
							How much garbage! We'll fix it now...
						</div>
						<div class="text">
							Stupid users...
						</div>
						<div class="text">
							Oh, these programming languages...
						</div>
						<div class="text">
							One day in the life of a programmer...
						</div>
						<div class="text">
							The work of a programmer...
						</div>
					</div>
				</div>
				<div class="nav">
					<label for="one" class="nav__items">
						<div class="nav__items-item nav__item-one" ></div>
					</label>
					<label for="two" class="nav__items">
						<div class="nav__items-item nav__item-two" ></div>
					</label>
					<label for="three" class="nav__items">
						<div class="nav__items-item nav__item-three" ></div>
					</label>
					<label for="four" class="nav__items">
						<div class="nav__items-item nav__item-four" ></div>
					</label>
					<label for="five" class="nav__items">
						<div class="nav__items-item nav__item-five" ></div>
					</label>
				</div>
			</div>

		</div>
	</div>
</body>
</html>
