<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./style.css">
	<link rel="shortcut icon" href="./assets/favicon/Mem.ico" type="image/x-icon">
	<title>cssMemeSlider</title>
</head>
<body>
	<div class="container">
		<div class="slider__wrapper">
			<input type="radio" name="slide" id="one" checked>
			<input type="radio" name="slide" id="two">
			<input type="radio" name="slide" id="three">
			<input type="radio" name="slide" id="four">
			<input type="radio" name="slide" id="five">

			<div class="slider__container">
				<div class="slide started">
					<img src="./assets/images/mem_1.jpg" alt="mem" class="mem">
				</div>
				<div class="slide">
					<img src="./assets/images/mem_2.jpg" alt="mem" class="mem">
				</div>
				<div class="slide">
					<img src="./assets/images/mem_3.jpg" alt="mem" class="mem">
				</div>
				<div class="slide">
					<img src="./assets/images/mem_4.jpg" alt="mem" class="mem">
				</div>
				<div class="slide">
					<img src="./assets/images/mem_5.jpg" alt="mem" class="mem">
				</div>
			</div>
			<div class="text__wrapper">
				<div class="text__container">
					<div class="text__slider">
						<div class="text">
							How much garbage! We'll fix it now...
						</div>
						<div class="text">
							Stupid users...
						</div>
						<div class="text">
							Oh, these programming languages...
						</div>
						<div class="text">
							One day in the life of a programmer...
						</div>
						<div class="text">
							The work of a programmer...
						</div>
					</div>
				</div>
			</div>
			<div class="nav">
				<label for="one" class="nav__item">
					<div class="nav__item nav__item-one" ></div>
				</label>
				<label for="one" class="nav__item">
					<div class="nav__item nav__item-two" ></div>
				</label>
				<label for="one" class="nav__item">
					<div class="nav__item nav__item-three" ></div>
				</label>
				<label for="one" class="nav__item">
					<div class="nav__item nav__item-four" ></div>
				</label>
				<label for="one" class="nav__item">
					<div class="nav__item nav__item-five" ></div>
				</label>
			</div>
		</div>
	</div>
</body>
</html>
